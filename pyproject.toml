[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texas-education-kb"
version = "0.1.0"
description = "Local-first Texas education knowledge base with citation-focused retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "A2Techify" }]
dependencies = [
  "beautifulsoup4>=4.12",
  "pydantic>=2.8",
  "pypdf>=4.3",
  "pyyaml>=6.0",
  "requests>=2.32",
]

[project.optional-dependencies]
serve = [
  "fastapi>=0.112",
  "uvicorn[standard]>=0.30",
]
embeddings = [
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
]
test = [
  "pytest>=8.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
